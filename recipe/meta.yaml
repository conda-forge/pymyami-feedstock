{% set name = "pymyami" %}
{% set version = "2.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pymyami-{{ version }}.tar.gz
  sha256: fc6b1a5e5982a8e246d97238809fba8e6e086fd595b89ea6489c4c4b0ea12285

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - pandas
    - matplotlib-base
    - scikit-learn
    - scipy

test:
  imports:
    - pymyami
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/PalaeoCarb/MyAMI
  summary: MyAMI specific ion interaction model for calculating stoichiometric equilibrium constants in modified seawater.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
